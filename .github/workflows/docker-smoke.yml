name: Docker Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose up (db + redis)
        run: docker compose up -d db redis

      - name: Wait for health
        run: |
          for i in {1..60}; do
            DB_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' chorus-db-1 2>/dev/null || true)
            REDIS_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' chorus-redis-1 2>/dev/null || true)
            if [[ "$DB_HEALTH" == '"healthy"' && "$REDIS_HEALTH" == '"healthy"' ]]; then
              echo "Services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for healthy services"
          docker compose ps
          exit 1

      - name: Compose down
        if: always()
        run: docker compose down -v
