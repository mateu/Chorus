name: Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests with coverage (if script exists)
        run: |
          if pnpm run | grep -q "test:coverage"; then
            pnpm test:coverage -- --reporter=json --outputFile=coverage/test-results.json
          else
            echo "No test:coverage script found; skipping test run."
          fi

      - name: Coverage report PR comment
        if: github.event_name == 'pull_request' && always() && hashFiles('coverage/coverage-summary.json') != '' && github.repository == 'mateu/Chorus'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          vite-config-path: vitest.config.ts

      - name: Extract coverage percentage
        if: github.ref == 'refs/heads/main' && always() && hashFiles('coverage/coverage-summary.json') != '' && github.repository == 'mateu/Chorus'
        id: coverage
        run: |
          PCT=$(node -e "const s=JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')); console.log(s.total.lines.pct)")
          echo "pct=$PCT" >> $GITHUB_OUTPUT

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && always() && steps.coverage.outputs.pct != '' && github.repository == 'mateu/Chorus'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage-badge.json
          label: coverage
          message: ${{ steps.coverage.outputs.pct }}%
          valColorRange: ${{ steps.coverage.outputs.pct }}
          minColorRange: 50
          maxColorRange: 100

      - name: Upload coverage report
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
